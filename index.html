  .stage{
    width:var(--size);height:var(--size);
    position:relative;

    background:#000;
    border:1px solid var(--line);
    box-shadow:0 18px 50px rgba(0,0,0,.55);
    cursor:grab;touch-action:none;
  }
  .stage.dragging{cursor:grabbing}
  .scene{
    position:absolute;inset:0;
    perspective:calc(var(--size) * 3.4);   /* 相机位于立方体中心，视角约 80° */
    perspective-origin:50% 50%;
  }
  .cube{
    position:absolute;inset:0;
    transform-style:preserve-3d;
    will-change:transform;
  }
  .face{
    position:absolute;inset:0;
    overflow:hidden;background:#141a21;
    backface-visibility:visible;   /* 内景视角：从中心看各面都是背面朝向相机，必须可见 */
  }
  .face img{
    width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;
  }
  /* 面标记 HUD：浮在 3D 层之上，显示当前正对的是哪个面（校对接缝用） */

    position:absolute;left:50%;top:12px;transform:translateX(-50%);

<script>
/* ==========================================================================
 * 缺图兜底：某个 assets/panorama_N.jpg 不存在时，显示文件名而不是一片黑
 * ========================================================================== */
document.querySelectorAll('.face img').forEach(img=>{
  img.addEventListener('error', ()=>{
    const name = img.dataset.file || '图片';
    const svg =
      `<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'>`+
      `<rect width='600' height='600' fill='#2a303a'/>`+
      `<text x='300' y='290' font-family='sans-serif' font-size='26' fill='#8b98a6'`+
      ` text-anchor='middle'>缺少图片</text>`+
      `<text x='300' y='330' font-family='monospace' font-size='24' fill='#e8edf3'`+
      ` text-anchor='middle'>assets/${name}</text>`+
      `</svg>`;
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }, {once:true});
});
/* ==========================================================================
 * 视角控制：yaw 水平（环绕），pitch 俯仰
 * ========================================================================== */
const stage    = document.getElementById('stage');
const cube     = document.getElementById('cube');
const btnAuto  = document.getElementById('btnAuto');
const btnDemo  = document.getElementById('btnDemo');
const btnReset = document.getElementById('btnReset');
const btnTags  = document.getElementById('btnTags');
const yawRead  = document.getElementById('yawRead');
const pitchRead= document.getElementById('pitchRead');
let yaw = 0;            // 水平角（度）
let pitch = 0;          // 俯仰角（度）
let autoRotate = true;
const SPEED = 0.18;     // 自动环绕速度（度 / 帧）
let dragging = false;
let lastX = 0, lastY = 0;
let demoTotal = 0, demoRunning = false;
const DEMO_TARGET = 720;  // 720° = 两圈
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
/* 当前正对的面（校对接缝时用） */
const HUD_NAMES = [
  '前 FRONT · panorama_1.jpg',
  '右 RIGHT · panorama_2.jpg',
  '后 BACK · panorama_3.jpg',
  '左 LEFT · panorama_4.jpg'
];
const hud = document.getElementById('hud');
function currentFaceLabel(){
  if(pitch >= 45)  return '上 TOP · panorama_5.jpg';
  if(pitch <= -45) return '下 BOTTOM · panorama_6.jpg';
  const yawMod = ((yaw % 360) + 360) % 360;
  const idx = Math.round(yawMod / 90) % 4;
  return HUD_NAMES[idx];
}
function render(){
  cube.style.transform = `rotateX(${pitch}deg) rotateY(${yaw}deg)`;
  const yawMod = ((yaw % 360) + 360) % 360;
  yawRead.textContent   = Math.round(yawMod) + '°';
  pitchRead.textContent = Math.round(pitch) + '°';
  hud.textContent = '正对：' + currentFaceLabel();
}
/* ---- 指针拖拽 ---- */
stage.addEventListener('pointerdown', e=>{
  dragging = true;
  stage.classList.add('dragging');
  stage.setPointerCapture(e.pointerId);
  lastX = e.clientX; lastY = e.clientY;
});
stage.addEventListener('pointermove', e=>{
  if(!dragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  yaw   -= dx * 0.35;
  pitch  = clamp(pitch - dy * 0.35, -89, 89);
  render();
});
function endDrag(){ dragging = false; stage.classList.remove('dragging'); }
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);
/* ---- 滚轮俯仰 ---- */
stage.addEventListener('wheel', e=>{
  e.preventDefault();
  pitch = clamp(pitch + (e.deltaY > 0 ? 3 : -3), -89, 89);
  render();
},{passive:false});
/* ---- 键盘 ---- */
window.addEventListener('keydown', e=>{
  const step = e.shiftKey ? 10 : 3;
  if(e.key === 'ArrowLeft')  { yaw += step;  render(); e.preventDefault(); }
  if(e.key === 'ArrowRight') { yaw -= step;  render(); e.preventDefault(); }
  if(e.key === 'ArrowUp')    { pitch = clamp(pitch + step, -89, 89); render(); e.preventDefault(); }
  if(e.key === 'ArrowDown')  { pitch = clamp(pitch - step, -89, 89); render(); e.preventDefault(); }
  if(e.key === 't' || e.key === 'T'){ btnTags.click(); }
});
/* ---- 按钮 ---- */
btnAuto.addEventListener('click', ()=>{
  autoRotate = !autoRotate;
  demoRunning = false;
  btnAuto.textContent = autoRotate ? '暂停环绕' : '自动环绕';
});
// 演示：从当前视角转满 720°（两圈）后自动停住
btnDemo.addEventListener('click', ()=>{
  autoRotate = false;
  btnAuto.textContent = '自动环绕';
  demoTotal = 0;
  demoRunning = true;
});
btnReset.addEventListener('click', ()=>{
  yaw = 0; pitch = 0; demoTotal = 0; demoRunning = false;
  render();
});
btnTags.addEventListener('click', ()=>{
  stage.classList.toggle('show-tags');
});
/* ---- 主循环 ---- */
function loop(){
  if(demoRunning){
    yaw += SPEED;
    demoTotal += SPEED;
    if(demoTotal >= DEMO_TARGET){    // 转满两圈（720°）后停住
      demoRunning = false;
      autoRotate = false;
      btnAuto.textContent = '自动环绕';
    }
  } else if(autoRotate && !dragging){
    yaw += SPEED;
  }
  render();
  requestAnimationFrame(loop);
}
render();
loop();
// 调试钩子：便于外部/脚本设置视角
window.__setView = (a, b)=>{ yaw = a; pitch = b; render(); };
</script>
